name: Circulo de Belleza
description: >-
  Círculo de Belleza is an authorized distributor of professional beauty products in Mexico, operating
  an e-commerce storefront at circulodebelleza.com. It sells salon-quality hair care, hair color, nail,
  barbershop, and facial/spa supplies from 40+ professional brands (L'Oréal Professionnel, Olaplex, Wella,
  Schwarzkopf, Matrix, Alfaparf Milano) at professional pricing with no minimum purchase, same-day
  fulfillment, and nationwide Mexico delivery. The store is built on Shopify and exposes a native
  agent-commerce surface: a published llms.txt/agents.md, OpenID Connect and OAuth authorization-server
  discovery documents, and a Universal Commerce Protocol (UCP) MCP endpoint for agent-driven catalog
  search, cart, and buyer-approved checkout.
